version: "0.2"
name: dsh-scratch

pods:
  - id: scratch
    label: Scratch
    members:
      - id: dev1-dsh
        label: DSH dev
        agent_ref: "local:agents/dev1-dsh"
        profile: default
        # NOTE: dsh is not an accepted runtime (SUPPORTED_RUNTIMES has only
        # claude-code, codex, pi, omp, terminal, stub) and preflight rejects it.
        # `rig adopt` materializes topology WITHOUT launching, so this label is
        # inert for an adopted seat — but it is wrong, and anything that tries to
        # relaunch this node will do the wrong thing. See ../README.md.
        runtime: stub
        cwd: "."    # replaced by start-seat.sh / the adopter with the real repo path
    edges: []

edges: []
