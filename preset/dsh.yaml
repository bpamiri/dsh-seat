# OpenRig runner preset for DeepSeek Harness (dsh) over ACP v1.
# Copy to $OPENRIG_HOME/community-harnesses/dsh.yaml.
format: 1
name: dsh
command: dsh-seat
maintainer: bpamiri
runner: true
launch_result: true
first_input: true
passes_model: true
resume: true
limits:
  - permission requests are refused at once (first version); a job that needs an edit or command approved cannot finish
  - a prompt whose whole text is /abort cannot be sent; Ctrl-C inside a paste also aborts
  - without a TTY the runner reads input line by line; the channel is not binary-safe
  - fork is unsupported
  - guidance, skills and startup files are not placed by OpenRig for community harnesses and are not projected by this runner
  - reopening uses ACP session/resume; tested with dsh 0.2.1-rc.2, which advertises sessionCapabilities.resume and no loadSession (session/load returns -32601); the session/load fallback is for other ACP agents
  - the pane states whether the runner resumed (resuming <ref> (asked by OpenRig)) or started a new conversation (OpenRig passed no resume ref); --require-resume or DSH_SEAT_REQUIRE_RESUME=1 refuses a launch with no resume ref, spawning nothing and recording error: resume_required
  - the declared model is matched to dsh's advertised model option by provider/model (provider exact or a substring, unique model id), a unique bare id, or an exact opaque selector; a value that cannot be mapped is reported in the pane and dsh's own default remains; it is applied on fresh launches and on resumes
  - a per-seat writable DSH_HOME is provisioned when unset (from the operator's acp profile, with session-log and plugin-inventory uploads off); an explicit DSH_HOME=$HOME/.dsh is refused; .credentials.yaml is never copied or linked
  - the agent child gets the baseline shell, OpenRig identity/routing variables, its own DSH_HOME, dsh's telemetry choice (DSH_TELEMETRY_DISABLED=1 unless the operator chose one), and the declared provider's key when set; the activity hook token and runner-only launch variables are not inherited
  - activity reports real ACP events only: an accepted prompt, permission notices, tool calls (PreToolUse), message chunks (active), the turn's end and the agent's exit; every tool call posts, and message/thought chunks are throttled to at most one active post per 10 s per turn; every post for a turn carries its turnId
  - a long silent step (a tool call or thinking with no output) still reads unknown after 15 s; event-driven posts cannot cover silence
  - idle liveness is a Stop at turn end plus a Stop/idle_heartbeat every 60 s, both with livenessSeconds: 60; the heartbeat stops while a turn is open or attention is held
  - carrying a turnId does not make OpenRig reject a stale event; that is the daemon-side work on OpenRig #43
  - stop kills the runner's agent child on hangup; OpenRig does no external compute cleanup
  - resume reports dsh's "not resumable"/not-found refusal as missing, and any other failure as unconfirmed
