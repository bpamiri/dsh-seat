# OpenRig runner preset for DeepSeek Harness (dsh) over ACP v1.
# Copy to $OPENRIG_HOME/community-harnesses/dsh.yaml.
format: 1
name: dsh
command: dsh-seat
maintainer: bpamiri
runner: true
launch_result: true
first_input: true
passes_model: true
resume: true
limits:
  - permission requests are refused at once (first version); a job that needs an edit or command approved cannot finish
  - a prompt whose whole text is /abort cannot be sent; Ctrl-C inside a paste also aborts
  - without a TTY the runner reads input line by line; the channel is not binary-safe
  - fork is unsupported
  - guidance, skills and startup files are not placed by OpenRig for community harnesses and are not projected by this runner
  - reopening uses ACP session/resume; tested with dsh 0.2.1-rc.2, which advertises sessionCapabilities.resume and no loadSession (session/load returns -32601); the session/load fallback is for other ACP agents
  - the declared model is matched to dsh's advertised model option by provider/model (provider exact or a substring, unique model id), a unique bare id, or an exact opaque selector; a value that cannot be mapped is reported in the pane and dsh's own default remains; it is applied on fresh launches and on resumes
  - the agent child gets only PATH, HOME, USER, LOGNAME, TERM, LANG, LC_ALL, SHELL, TMPDIR, DSH_HOME and the declared provider's key when set; it does not inherit the activity hook token or other OpenRig variables
  - activity is turn boundaries, permission notices and exits, not per-token or per-tool working posts
  - idle liveness is one 30 s report at turn end, with no periodic heartbeat; a seat idle longer than about 60 s may read unknown
  - stop kills the runner's agent child on hangup; OpenRig does no external compute cleanup
  - resume reports dsh's "not resumable"/not-found refusal as missing, and any other failure as unconfirmed
